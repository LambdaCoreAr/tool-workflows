name: selftest

on:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
      - name: Static checks
        run: scripts/lint.sh
      - name: Unit tests
        run: bats tests/bats

  node-service-empty:
    uses: ./.github/workflows/ci-node.yml
    with:
      kind: service
      project_dir: tests/fixtures/node-empty
      workflows_ref: ${{ github.event.pull_request.head.sha }}

  node-library-empty:
    uses: ./.github/workflows/ci-node.yml
    with:
      kind: library
      project_dir: tests/fixtures/node-empty
      workflows_ref: ${{ github.event.pull_request.head.sha }}

  node-library-populated:
    uses: ./.github/workflows/ci-node.yml
    with:
      kind: library
      project_dir: tests/fixtures/node-populated
      workflows_ref: ${{ github.event.pull_request.head.sha }}
