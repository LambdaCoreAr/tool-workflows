name: ci-docs

on:
  workflow_call:
    inputs:
      workflows_ref:
        description: ref of LambdaCoreAr/tool-workflows to load scripts from
        required: false
        default: v1
        type: string
      project_dir:
        description: directory holding the documentation
        required: false
        default: .
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint markdown
        working-directory: ${{ inputs.project_dir }}
        run: npx --yes markdownlint-cli2@0.14.0 "**/*.md" "**/*.MD" "#node_modules"

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Load scripts
        uses: actions/checkout@v4
        with:
          repository: LambdaCoreAr/tool-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .tool-workflows
      - name: Validate the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: .tool-workflows/scripts/pr-title-check.sh "$TITLE" "$BODY"
