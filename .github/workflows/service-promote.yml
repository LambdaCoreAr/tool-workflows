name: service-promote

on:
  workflow_call:
    inputs:
      tag:
        description: prerelease tag to promote, for example 1.3.0-rc.3
        required: true
        type: string
      workflows_ref:
        description: ref of LambdaCoreAr/tool-workflows to load scripts from
        required: false
        default: v1
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: service-promote-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load scripts
        uses: actions/checkout@v4
        with:
          repository: LambdaCoreAr/tool-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .tool-workflows
      - name: Template guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}" \
            | .tool-workflows/scripts/template-guard.sh >> "$GITHUB_OUTPUT"
      - name: Template repository — nothing to promote
        if: steps.guard.outputs.is_template == 'true'
        run: echo "${{ github.repository }} is a template — no promotion"
      - name: Check the tag is a prerelease
        if: steps.guard.outputs.is_template == 'false'
        run: |
          case "${{ inputs.tag }}" in
            *-rc.*) ;;
            *) echo "not a prerelease tag: ${{ inputs.tag }}" >&2; exit 1 ;;
          esac
      - name: Derive names
        id: name
        if: steps.guard.outputs.is_template == 'false'
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          name="${repo#svc-}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG%%-rc.*}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - name: Log in to GHCR
        if: steps.guard.outputs.is_template == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Re-tag the same digest
        if: steps.guard.outputs.is_template == 'false'
        env:
          IMAGE: ghcr.io/lambdacorear/${{ steps.name.outputs.name }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ steps.name.outputs.version }}" \
            "${IMAGE}:${{ inputs.tag }}"
          docker buildx imagetools inspect "${IMAGE}:${{ steps.name.outputs.version }}"
      - name: Cut the release
        if: steps.guard.outputs.is_template == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" \
            --notes "Promoted from ${{ inputs.tag }}. Same image digest."
