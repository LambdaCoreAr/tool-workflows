name: service-promote

on:
  workflow_call:
    inputs:
      tag:
        description: prerelease tag to promote, for example 1.3.0-rc.3
        required: true
        type: string
      workflows_ref:
        description: ref of LambdaCoreAr/tool-workflows to load scripts from
        required: false
        default: v1
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: service-promote-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load scripts
        uses: actions/checkout@v4
        with:
          repository: LambdaCoreAr/tool-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .tool-workflows
      - name: Template guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}" \
            | .tool-workflows/scripts/template-guard.sh >> "$GITHUB_OUTPUT"
      - name: Template repository — nothing to promote
        if: steps.guard.outputs.is_template == 'true'
        run: echo "${{ github.repository }} is a template — no promotion"
      - name: Validate the tag and derive names
        id: name
        if: steps.guard.outputs.is_template == 'false'
        env:
          RAW: ${{ inputs.tag }}
        run: |
          # A substring match on -rc. is not enough. `v1.3.0-rc.3` is what a human
          # copying from a release page types, and it would derive the tag `vv1.3.0`;
          # `-rc.1` would derive the tag `v`. Accept a leading v, then require the
          # exact prerelease shape.
          tag="${RAW#v}"
          if [[ ! $tag =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::tag must look like 1.3.0-rc.3 (a leading v is accepted), got: ${RAW}"
            exit 1
          fi
          repo="${GITHUB_REPOSITORY#*/}"
          # Grouped, not three separate appends: shellcheck's SC2129 fails the lint
          # gate on consecutive redirections to the same file.
          {
            echo "name=${repo#svc-}"
            echo "tag=${tag}"
            echo "version=${tag%%-rc.*}"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.guard.outputs.is_template == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Re-tag the same digest
        id: retag
        if: steps.guard.outputs.is_template == 'false'
        env:
          IMAGE: ghcr.io/lambdacorear/${{ steps.name.outputs.name }}
          TAG: ${{ steps.name.outputs.tag }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          # Refuse to repoint a tag that has already been released. Without this,
          # promoting a second prerelease of the same version silently moves
          # :X.Y.Z to different bytes before the git tag push fails.
          if docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists — refusing to repoint a released tag."
            echo "::error::If a previous promotion failed verification, that tag may be unverified;"
            echo "::error::delete it in GHCR, then re-run this workflow."
            exit 1
          fi
          src=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{ .Manifest.Digest }}')
          # --prefer-index=false keeps a single-platform manifest a manifest; the
          # default would wrap it in a fresh index and change the digest.
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE}:${VERSION}" "${IMAGE}:${TAG}"
          dst=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')
          if [[ "$src" != "$dst" ]]; then
            echo "::error::promoted digest ${dst} does not match prerelease digest ${src}."
            echo "::error::${IMAGE}:${VERSION} now exists but is UNVERIFIED. Delete that tag in"
            echo "::error::GHCR before re-running, or the guard above will refuse every retry."
            exit 1
          fi
          echo "digest=${src}" >> "$GITHUB_OUTPUT"
      - name: Cut the release
        if: steps.guard.outputs.is_template == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.name.outputs.version }}
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: |
          # Both halves are guarded so a retry after a partial failure converges
          # instead of dying on the half that already succeeded.
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
          if ! gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" \
              --notes "Promoted from ${TAG}. Digest ${DIGEST}."
          fi
