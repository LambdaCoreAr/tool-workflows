name: library-release

on:
  workflow_call:
    inputs:
      language:
        description: node or dotnet
        required: true
        type: string
      workflows_ref:
        description: ref of LambdaCoreAr/tool-workflows to load scripts from
        required: false
        default: v1
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: library-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load scripts
        uses: actions/checkout@v4
        with:
          repository: LambdaCoreAr/tool-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .tool-workflows
      - name: Template guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}" \
            | .tool-workflows/scripts/template-guard.sh >> "$GITHUB_OUTPUT"
      - name: Template repository — nothing to release
        if: steps.guard.outputs.is_template == 'true'
        run: echo "${{ github.repository }} is a template — no release"
      - name: Compute the next version
        id: version
        if: steps.guard.outputs.is_template == 'false'
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          range=${latest:+${latest}..HEAD}
          git log "${range:-HEAD}" --pretty=%s \
            | .tool-workflows/scripts/next-version.sh "$latest" >> "$GITHUB_OUTPUT"
      - name: No version-bearing changes
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump == 'none'
        run: echo "nothing version-bearing since the last tag — no release"
      - name: Write the release notes
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          range=${latest:+${latest}..HEAD}
          git log "${range:-HEAD}" --pretty='- %s' > notes.md
      - name: Set up Node
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none' && inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@lambdacorear'
      - name: Build and test the npm package
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none' && inputs.language == 'node'
        run: |
          npm install --no-audit --no-fund
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build --if-present
          npm test
      - name: Set up .NET
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none' && inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test the NuGet package
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none' && inputs.language == 'dotnet'
        run: |
          dotnet build --configuration Release "-p:Version=${{ steps.version.outputs.version }}"
          dotnet test --configuration Release --no-build
          dotnet pack --configuration Release --no-build \
            "-p:Version=${{ steps.version.outputs.version }}" --output ./artifacts
      - name: Tag
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
      - name: Publish the npm package
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none' && inputs.language == 'node'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '.tool-workflows/' 'notes.md' >> .npmignore
          npm publish
      - name: Publish the NuGet package
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none' && inputs.language == 'dotnet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/LambdaCoreAr/index.json" \
            --api-key "$GH_TOKEN"
      - name: Cut the release
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file notes.md
