name: service-build

on:
  workflow_call:
    inputs:
      language:
        description: node or dotnet
        required: true
        type: string
      infra_repo:
        description: repository holding the environment pins
        required: false
        default: infra-platform
        type: string
      workflows_ref:
        description: ref of LambdaCoreAr/tool-workflows to load scripts from
        required: false
        default: v1
        type: string
    secrets:
      INFRA_APP_ID:
        required: true
      INFRA_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: service-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load scripts
        uses: actions/checkout@v4
        with:
          repository: LambdaCoreAr/tool-workflows
          ref: ${{ inputs.workflows_ref }}
          path: .tool-workflows
      - name: Template guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}" \
            | .tool-workflows/scripts/template-guard.sh >> "$GITHUB_OUTPUT"
      - name: Template repository — nothing to build
        if: steps.guard.outputs.is_template == 'true'
        run: echo "${{ github.repository }} is a template — no build"
      - name: Derive the service name
        id: name
        if: steps.guard.outputs.is_template == 'false'
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          echo "name=${repo#svc-}" >> "$GITHUB_OUTPUT"
      - name: Compute the target version
        id: version
        if: steps.guard.outputs.is_template == 'false'
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          range=${latest:+${latest}..HEAD}
          git log "${range:-HEAD}" --pretty=%s \
            | .tool-workflows/scripts/next-version.sh "$latest" >> "$GITHUB_OUTPUT"
      - name: No version-bearing changes
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump == 'none'
        run: echo "nothing version-bearing since the last release — no prerelease"
      - name: Check the infra repository is in scope
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        env:
          INFRA: ${{ inputs.infra_repo }}
        run: |
          case "$INFRA" in
            infra-*) ;;
            *) echo "::error::infra_repo must name an infra-* repository, got ${INFRA}"; exit 1 ;;
          esac
      - name: Compute the prerelease number
        id: rc
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.name.outputs.name }}
        run: |
          # A 404 means the package does not exist yet, which is rc=1. Every other
          # failure must abort: an empty tag list restarts numbering, and the push
          # below would then move an already-published prerelease to different bytes
          # — silently, on a green run.
          if ! gh api --paginate \
                 "/orgs/LambdaCoreAr/packages/container/${NAME}/versions" \
                 --jq '.[].metadata.container.tags[]? // empty' > tags.txt 2> err.txt; then
            grep -q 'HTTP 404' err.txt || { cat err.txt >&2; exit 1; }
            : > tags.txt
          fi
          .tool-workflows/scripts/rc-number.sh "${{ steps.version.outputs.version }}" \
            < tags.txt >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the prerelease image
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        env:
          TAG: ghcr.io/lambdacorear/${{ steps.name.outputs.name }}:${{ steps.version.outputs.version }}-rc.${{ steps.rc.outputs.rc }}
        run: |
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "::error::${TAG} already exists — refusing to overwrite a published prerelease"
            exit 1
          fi
          # The scripts checkout and these scratch files sit in the build context.
          # A service Dockerfile with `COPY . .` would otherwise bake them into the image.
          printf '%s\n' '.tool-workflows/' 'tags.txt' 'err.txt' >> .dockerignore
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$TAG" .
          docker push "$TAG"
      - name: Mint an infra token
        id: infra_token
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: LambdaCoreAr
          repositories: ${{ inputs.infra_repo }}
      - name: Open the version-bump pull request
        if: steps.guard.outputs.is_template == 'false' && steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ steps.infra_token.outputs.token }}
          NAME: ${{ steps.name.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}-rc.${{ steps.rc.outputs.rc }}
          INFRA: LambdaCoreAr/${{ inputs.infra_repo }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${INFRA}.git" infra
          cd infra
          git config user.name "lambdacore-infra-bot"
          git config user.email "infra-bot@lambdacore.com.ar"
          branch="bump/${NAME}-${VERSION}"
          git checkout -b "$branch"
          mkdir -p environments
          touch environments/dev.tfvars
          if grep -qE "^${NAME}_version[[:space:]]*=" environments/dev.tfvars; then
            sed -i -E "s|^${NAME}_version[[:space:]]*=.*|${NAME}_version = \"${VERSION}\"|" \
              environments/dev.tfvars
          else
            echo "${NAME}_version = \"${VERSION}\"" >> environments/dev.tfvars
          fi
          git add environments/dev.tfvars
          git commit -m "chore: pin ${NAME} to ${VERSION} in dev"
          git push -u origin "$branch"
          gh pr create --title "chore: pin ${NAME} to ${VERSION} in dev" \
            --body "Automated pin from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
          gh pr merge --auto --squash
